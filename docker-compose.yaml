version: '3'
services:
  db:
    image: postgres:latest@sha256:8ff36f3c66371cba71d20ceedccfc3de9669a68737607888c4ef0af93abe8e39
  keycloak:
    image: ghcr.io/radiorabe/keycloak:latest
    build: .
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_HOSTNAME: localhost
